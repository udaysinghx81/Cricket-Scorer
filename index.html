/* ── HELPERS ── */

async function resizeImg(file,max=160){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{const img=new Image();img.onload=()=>{let{width:w,height:h}=img;if(w>h){if(w>max){h=Math.round(h*(max/w));w=max}}else{if(h>max){w=Math.round(w*(max/h));h=max}}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",.72))};img.onerror=rej;img.src=e.target.result};r.onerror=rej;r.readAsDataURL(file);
  });
}

/* ── SCORING ENGINE ── */
function newInn(batTeam,bowlTeam,num){
  return{num,batId:batTeam.id,bowlId:bowlTeam.id,totalBatters:batTeam.players.length,
    runs:0,wickets:0,balls:0,target:null,overBalls:[],outIds:[],battingOrderUsed:[],
    batsmen:{},bowlers:{},striker:null,nonStriker:null,bowler:null,
    needBowler:true,completed:false};
}
function eb(inn,id){if(!inn.batsmen[id])inn.batsmen[id]={runs:0,balls:0,fours:0,sixes:0,out:false,howOut:null}}
function ebw(inn,id){if(!inn.bowlers[id])inn.bowlers[id]={balls:0,runs:0,wickets:0}}
function swap(inn){if(inn.nonStriker!=null){const t=inn.striker;inn.striker=inn.nonStriker;inn.nonStriker=t}}
function eligible(inn,players){return players.filter(p=>!inn.outIds.includes(p.id)&&p.id!==inn.striker&&p.id!==inn.nonStriker)}
function needStriker(inn,pl){return inn.striker==null&&eligible(inn,pl).length>0}
function needNonStriker(inn,pl){return inn.nonStriker==null&&inn.striker!=null&&eligible(inn,pl).length>0}
function setBatter(inn,id){eb(inn,id);inn.battingOrderUsed.push(id);if(inn.striker==null)inn.striker=id;else inn.nonStriker=id}
function setBowler(inn,id){ebw(inn,id);inn.bowler=id;inn.needBowler=false}

function bowl(inn,ev,bwlId){
  ebw(inn,bwlId);inn.bowler=bwlId;
  let legal=true,label="";
  if(ev.kind==="RUN"){
    inn.runs+=ev.runs;const b=inn.batsmen[inn.striker];b.runs+=ev.runs;b.balls++;
    if(ev.runs===4)b.fours++;if(ev.runs===6)b.sixes++;
    inn.bowlers[bwlId].runs+=ev.runs;label=""+ev.runs;
    if(ev.runs%2===1)swap(inn);
  } else if(ev.kind==="EXTRA"){
    if(ev.type==="WD"){legal=false;const tot=1+(ev.runs||0);inn.runs+=tot;inn.bowlers[bwlId].runs+=tot;label="WD"}
    else if(ev.type==="NB"){legal=false;const tot=1+(ev.runs||0);inn.runs+=tot;inn.bowlers[bwlId].runs+=tot;if(ev.runs){const b=inn.batsmen[inn.striker];b.runs+=ev.runs;if(ev.runs===4)b.fours++;if(ev.runs===6)b.sixes++}label="NB"}
    else{inn.runs+=ev.runs;inn.bowlers[bwlId].runs+=ev.runs;inn.batsmen[inn.striker].balls++;label=ev.type;if(ev.runs%2===1)swap(inn)}
  } else if(ev.kind==="WICKET"){
    const dId=ev.dismissedId||inn.striker;
    if(ev.runsCompleted){inn.runs+=ev.runsCompleted;inn.batsmen[inn.striker].runs+=ev.runsCompleted;inn.bowlers[bwlId].runs+=ev.runsCompleted}
    inn.batsmen[inn.striker].balls++;inn.batsmen[dId].out=true;inn.batsmen[dId].howOut=ev.howOut||"out";
    if(!ev.noBallCredit)inn.bowlers[bwlId].wickets++;
    inn.wickets++;inn.outIds.push(dId);label="W";
    if(dId===inn.striker)inn.striker=null;else if(dId===inn.nonStriker)inn.nonStriker=null;
    const elig=(ev.teamPlayers||[]).filter(p=>!inn.outIds.includes(p.id)&&p.id!==inn.striker&&p.id!==inn.nonStriker);
    if(elig.length===0&&inn.striker==null&&inn.nonStriker!=null){inn.striker=inn.nonStriker;inn.nonStriker=null}
    if(inn.striker==null&&inn.nonStriker==null)inn.completed=true;
  }
  if(legal){inn.balls++;inn.bowlers[bwlId].balls++}
  inn.overBalls.push({label,legal});
  if(legal&&inn.balls%6===0&&!inn.completed){inn.overBalls=[];swap(inn);inn.needBowler=true}
  return inn;
}

/* ── MATCH ORCHESTRATION ── */
function teamById(cfg,id){return cfg.teamA.id===id?cfg.teamA:cfg.teamB}
function batFirst(m){return teamById(m.cfg,m.cfg.batFirstId)}
function bowlFirst(m){return m.cfg.teamA.id===m.cfg.batFirstId?m.cfg.teamB:m.cfg.teamA}
function curInn(m){return m.innings[m.innIdx]}
function teamsFor(m,inn){return{bat:teamById(m.cfg,inn.batId),bowl:teamById(m.cfg,inn.bowlId)}}

function makeInn(m,idx){
  const role=m.plan[idx];
  const bat=role==="first"?batFirst(m):bowlFirst(m);
  const bowl=role==="first"?bowlFirst(m):batFirst(m);
  const inn=newInn(bat,bowl,idx+1);
  if(idx===m.plan.length-1){
    const opp=m.innings.filter(i=>i.batId===bowl.id).reduce((s,i)=>s+i.runs,0);
    const own=m.innings.filter(i=>i.batId===bat.id).reduce((s,i)=>s+i.runs,0);
    inn.target=opp-own+1;
  }
  return inn;
}

function autoFill(m){
  const inn=curInn(m);if(!inn||inn.completed)return m;
  const {bat,bowl}=teamsFor(m,inn);
  if(inn.needBowler&&bowl.players.length===1)setBowler(inn,bowl.players[0].id);
  if(needStriker(inn,bat.players)){const e=eligible(inn,bat.players);if(e.length===1)setBatter(inn,e[0].id)}
  if(needNonStriker(inn,bat.players)){const e=eligible(inn,bat.players);if(e.length===1)setBatter(inn,e[0].id)}
  return m;
}

function computeResult(m){
  const aT=m.innings.filter(i=>i.batId===m.cfg.teamA.id).reduce((s,i)=>s+i.runs,0);
  const bT=m.innings.filter(i=>i.batId===m.cfg.teamB.id).reduce((s,i)=>s+i.runs,0);
  const last=m.innings[m.innings.length-1];
  if(last.target!=null&&last.runs>=last.target){
    const wt=teamById(m.cfg,last.batId);const wl=Math.max(0,last.totalBatters-1-last.wickets);
    return{aT,bT,text:`${wt.name} won by ${wl} wicket${wl===1?"":"s"}`}
  }
  if(aT===bT)return{aT,bT,text:"Match tied"};
  const winner=aT>bT?m.cfg.teamA:m.cfg.teamB;const margin=Math.abs(aT-bT);
  return{aT,bT,text:`${winner.name} won by ${margin} run${margin===1?"":"s"}`};
}

function checkEnd(m){
  let inn=curInn(m);if(!inn.completed){
    if(m.cfg.oversLimit!=null&&inn.balls>=m.cfg.oversLimit*6)inn.completed=true;
    if(inn.target!=null&&inn.runs>=inn.target)inn.completed=true;
  }
  if(!inn.completed)return m;
  const isLast=m.innIdx===m.plan.length-1;
  if(isLast){m.status="done";m.result=computeResult(m)}
  else{const nxt=m.innIdx+1;m.innings.push(makeInn(m,nxt));m.innIdx=nxt;m=autoFill(m)}
  return m;
}

function getPending(m){
  if(m.status==="done")return null;
  const inn=curInn(m);const{bat,bowl}=teamsFor(m,inn);
  if(needStriker(inn,bat.players))return{type:"batter",slot:"striker"};
  if(needNonStriker(inn,bat.players))return{type:"batter",slot:"nonStriker"};
  if(inn.needBowler&&bowl.players.length>1)return{type:"bowler"};
  return null;
}

function startMatch({teamA,teamB,batFirstId,oversLimit,inningsPerTeam,formatLabel}){
  const plan=[];
  for(let i=0;i<inningsPerTeam;i++){plan.push("first");plan.push("second")}
  let m={cfg:{teamA,teamB,batFirstId,oversLimit,inningsPerTeam,formatLabel},
    plan,innings:[],innIdx:0,status:"playing",result:null};
  m.innings.push(makeInn(m,0));
  m=autoFill(m);
  return m;
}

function TeamEditor({initial,onSave,onCancel}){
  const [team,setTeam]=useState(initial||{id:uid("team"),name:"",players:[{id:uid("p"),name:"",photo:null}]});
  const refs=useRef({});
  function upP(id,patch){setTeam(t=>({...t,players:t.players.map(p=>p.id===id?{...p,...patch}:p)}))}
  function addP(){setTeam(t=>({...t,players:[...t.players,{id:uid("p"),name:"",photo:null}]}))}
  function remP(id){setTeam(t=>({...t,players:t.players.filter(p=>p.id!==id)}))}
  async function handlePhoto(id,file){if(!file)return;try{const d=await resizeImg(file,160);upP(id,{photo:d})}catch(e){}}
  const canSave=team.name.trim().length>0&&team.players.some(p=>p.name.trim().length>0);
  return<div style={{paddingBottom:110}}>
    <Hdr title={initial?"Edit team":"New team"} onBack={onCancel}/>
    <div style={{padding:"0 18px",display:"flex",flexDirection:"column",gap:14}}>
      <div>
        <label style={{fontSize:12,color:"rgba(180,200,255,0.45)",display:"block",marginBottom:6}}>TEAM NAME</label>
        <input value={team.name} onChange={e=>setTeam(t=>({...t,name:e.target.value}))} placeholder="e.g. Sunday Strikers" style={{width:"100%",background:"rgba(255,255,255,0.06)",border:`1px solid ${C.line}`,borderRadius:12,padding:"12px 14px",color:C.text,fontSize:15}}/>
      </div>
      <div>
        <label style={{fontSize:12,color:"rgba(180,200,255,0.45)",display:"block",marginBottom:8}}>PLAYERS ({team.players.length}) — any size squad</label>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {team.players.map((p,i)=><div key={p.id} style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>refs.current[p.id]?.click()} style={{background:"none",border:"none",padding:0,cursor:"pointer",position:"relative"}}>
              <Avatar player={p} size={40}/>
              <div style={{position:"absolute",bottom:-2,right:-2,background:C.accent,borderRadius:"50%",width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center"}}><Camera size={9} style={{color:"#04141A"}}/></div>
            </button>
            <input ref={el=>refs.current[p.id]=el} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handlePhoto(p.id,e.target.files?.[0])}/>
            <input value={p.name} onChange={e=>upP(p.id,{name:e.target.value})} placeholder={`Player ${i+1}`} style={{flex:1,background:"rgba(255,255,255,0.06)",border:`1px solid ${C.line}`,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14}}/>
            <button onClick={()=>remP(p.id)} style={{background:"none",border:"none",color:"rgba(180,200,255,0.45)",cursor:"pointer",padding:6}}><Xmark size={16}/></button>
          </div>)}
        </div>
        <button onClick={addP} style={{marginTop:10,width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"transparent",border:`1px dashed ${C.line}`,borderRadius:12,padding:"10px",color:"rgba(180,200,255,0.45)",cursor:"pointer",fontSize:13.5}}>
          <Plus size={15}/>Add player
        </button>
      </div>
      <div style={{display:"flex",gap:10,marginTop:6}}>
        <Btn variant="ghost" onClick={onCancel} style={{flex:1}}>Cancel</Btn>
        <Btn variant="accent" disabled={!canSave} onClick={()=>onSave(team)} style={{flex:1}}>Save team</Btn>
      </div>
    </div>
  </div>
}

/* ── NEW MATCH ── */
function NewMatchScreen({teams,onStart,onGoTeams}){
  const [aId,setAId]=useState(teams[0]?.id||null);
  const [bId,setBId]=useState(teams[1]?.id||null);
  const [fmt,setFmt]=useState("T20");
  const [cOv,setCOv]=useState(10);
  const [ipp,setIpp]=useState(1);
  const [bat,setBat]=useState(null);
  const ovLimit=fmt==="T20"?20:fmt==="ODI"?50:fmt==="TEST"?null:cOv;
  const tA=teams.find(t=>t.id===aId),tB=teams.find(t=>t.id===bId);
  const canStart=tA&&tB&&tA.id!==tB.id&&(bat===tA?.id||bat===tB?.id);
  if(teams.length<2)return<div style={{paddingBottom:110}}><Hdr title="New match"/><div style={{padding:"0 18px"}}><Card><div style={{color:"rgba(180,200,255,0.45)",fontSize:14,marginBottom:12}}>You need at least two teams.</div><Btn variant="accent" onClick={onGoTeams} full>Create a team</Btn></Card></div></div>;
  const TBtn=({val,lbl})=><button onClick={()=>setFmt(val)} style={{padding:"10px 6px",borderRadius:12,border:`1px solid ${fmt===val?C.accent:C.line}`,background:fmt===val?C.accentSoft:C.surface2,color:fmt===val?C.accentText:C.text,fontWeight:600,fontSize:13,cursor:"pointer"}}>{lbl}</button>;
  const IPBtn=({n})=><button onClick={()=>setIpp(n)} style={{flex:1,padding:"10px 6px",borderRadius:12,border:`1px solid ${ipp===n?C.accent:C.line}`,background:ipp===n?C.accentSoft:C.surface2,color:ipp===n?C.accentText:C.text,fontWeight:600,fontSize:13,cursor:"pointer"}}>{n} innings each</button>;
  return<div style={{paddingBottom:110}}>
    <Hdr title="New match"/>
    <div style={{padding:"0 18px",display:"flex",flexDirection:"column",gap:18}}>
      <div>
        <label style={{fontSize:12,color:"rgba(180,200,255,0.45)",display:"block",marginBottom:8}}>TEAMS</label>
        {[["Team A",aId,setAId,bId],["Team B",bId,setBId,aId]].map(([lbl,val,setter,excl])=><div key={lbl} style={{marginBottom:8}}>
          <div style={{fontSize:11.5,color:"rgba(180,200,255,0.45)",marginBottom:4}}>{lbl}</div>
          <select value={val||""} onChange={e=>setter(e.target.value)} style={{width:"100%",background:"rgba(255,255,255,0.06)",border:`1px solid ${C.line}`,borderRadius:12,padding:"11px 12px",color:C.text,fontSize:14}}>
            <option value="" disabled>Choose a team</option>

        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          <TBtn val="T20" lbl="T20"/><TBtn val="ODI" lbl="ODI"/><TBtn val="TEST" lbl="Test"/><TBtn val="CUSTOM" lbl="Custom"/>
        </div>
        {fmt==="CUSTOM"&&<div style={{marginTop:8,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:13,color:"rgba(180,200,255,0.45)"}}>Overs per innings</span>
          <input type="number" min={1} max={90} value={cOv} onChange={e=>setCOv(clamp(parseInt(e.target.value)||1,1,90))} style={{width:70,background:"rgba(255,255,255,0.06)",border:`1px solid ${C.line}`,borderRadius:10,padding:"8px 10px",color:C.text,fontSize:14,fontFamily:NF}}/>
        </div>}
        {fmt==="TEST"&&<div style={{marginTop:8,fontSize:12.5,color:"rgba(180,200,255,0.45)"}}>Unlimited overs per innings.</div>}
      </div>

        <label style={{fontSize:12,color:"rgba(180,200,255,0.45)",display:"block",marginBottom:8}}>INNINGS PER TEAM</label>
        <div style={{display:"flex",gap:8}}><IPBtn n={1}/><IPBtn n={2}/></div>
      </div>
      {tA&&tB&&<div>
        <label style={{fontSize:12,color:"rgba(180,200,255,0.45)",display:"block",marginBottom:8}}>BATS FIRST</label>
        <div style={{display:"flex",gap:8}}>
          {[tA,tB].map(t=><button key={t.id} onClick={()=>setBat(t.id)} style={{flex:1,padding:"10px 6px",borderRadius:12,border:`1px solid ${bat===t.id?C.accent:C.line}`,background:bat===t.id?C.accentSoft:C.surface2,color:bat===t.id?C.accentText:C.text,fontWeight:600,fontSize:13,cursor:"pointer"}}>{t.name}</button>)}
        </div>
      </div>}
      <Btn variant="accent" disabled={!canStart} onClick={()=>onStart({teamA:tA,teamB:tB,batFirstId:bat,oversLimit:ovLimit,inningsPerTeam:ipp,formatLabel:fmt==="CUSTOM"?`${cOv} overs`:fmt})} full>Start match</Btn>
    </div>
  </div>
}

/* ── MATCH SCREEN ── */
function BallDot({ball}){
  let bg="rgba(255,255,255,0.06)",col=C.text,br="rgba(255,255,255,0.1)",sh="none";
  if(ball.label==="6"){bg="rgba(220,38,38,0.18)";col="#FCA5A5";br="#DC2626";sh="0 0 10px rgba(220,38,38,0.55)"}
  else if(ball.label==="4"){bg="rgba(14,165,233,0.18)";col="#7DD3FC";br="#0EA5E9";sh="0 0 8px rgba(14,165,233,0.5)"}
  else if(ball.label==="W"){bg="rgba(255,255,255,0.18)";col="#FFF";br="rgba(255,255,255,0.6)";sh="0 0 6px rgba(255,255,255,0.3)"}
  else if(!ball.legal){bg="transparent";col=C.accentText;br=C.accent}
  return<div style={{minWidth:28,height:28,borderRadius:"50%",background:bg,border:`1.5px solid ${br}`,color:col,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11.5,fontWeight:700,fontFamily:NF,flexShrink:0,boxShadow:sh}}>{ball.label}</div>
}

function MatchScreen({match,onEvent,onBatter,onBowler,onUndo,canUndo,onDeclare,onExit,modal,setModal}){
  const inn=curInn(match);
  const {bat,bowl}=teamsFor(match,inn);
  const strPl=bat.players.find(p=>p.id===inn.striker);
  const nsPl=bat.players.find(p=>p.id===inn.nonStriker);
  const bwlPl=bowl.players.find(p=>p.id===inn.bowler);
  const strSt=inn.striker?inn.batsmen[inn.striker]:null;
  const nsSt=inn.nonStriker?inn.batsmen[inn.nonStriker]:null;
  const bwlSt=inn.bowler?inn.bowlers[inn.bowler]:null;
  const crr=inn.balls>0?(inn.runs/(inn.balls/6)).toFixed(2):"0.00";
  const ovLbl=match.cfg.oversLimit!=null?`${oversStr(inn.balls)}/${match.cfg.oversLimit}`:oversStr(inn.balls);
  let winBar=null;
  if(inn.target!=null){
    const rem=inn.target-inn.runs;const bleft=match.cfg.oversLimit!=null?match.cfg.oversLimit*6-inn.balls:null;
    const rrr=bleft&&bleft>0?rem/(bleft/6):null;
    const wir=1-inn.wickets/Math.max(1,inn.totalBatters-1);
    let p=50+(parseFloat(crr)-(rrr||parseFloat(crr)))*4+(wir-.5)*40;
    if(!rrr)p=50+(wir-.5)*60-Math.min(rem,100)*.2;
    winBar={prob:clamp(p,2,98),rem,bleft,rrr};
  }
  const [xPick,setXPick]=useState(null);
  const [confExit,setConfExit]=useState(false);
  const xStyle=(active)=>({padding:"13px 0",borderRadius:12,border:`1px solid ${active?"rgba(14,165,233,0.6)":"rgba(255,255,255,0.08)"}`,background:active?"rgba(14,165,233,0.14)":"rgba(255,255,255,0.05)",color:active?C.accentText:C.text,fontWeight:700,fontSize:13,cursor:"pointer",backdropFilter:"blur(8px)",boxShadow:active?"0 0 14px rgba(14,165,233,0.2) inset":"none"});
  return<div style={{paddingBottom:130}}>
    <Hdr title={`${bat.name} vs ${bowl.name}`} onBack={()=>setConfExit(true)} right={
      <button onClick={onUndo} disabled={!canUndo} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:12,padding:"8px 10px",color:canUndo?C.text:C.textMuted,cursor:canUndo?"pointer":"not-allowed",display:"flex",alignItems:"center",gap:6,fontSize:12.5,backdropFilter:"blur(8px)"}}>
        <Undo2 size={14}/>Undo
      </button>}/>
    <div style={{padding:"0 18px",display:"flex",flexDirection:"column",gap:14}}>
      <div style={{fontSize:10.5,color:"rgba(14,165,233,0.5)",letterSpacing:2.5,fontWeight:600}}>{match.cfg.formatLabel?.toUpperCase()} · INNINGS {inn.num} · {bat.name} BATTING</div>
      <Card style={{position:"relative",overflow:"hidden",background:"linear-gradient(135deg,rgba(14,165,233,0.1) 0%,rgba(109,40,217,0.07) 55%,rgba(5,5,8,0) 100%)",border:"1px solid rgba(14,165,233,0.22)",boxShadow:"0 0 40px rgba(14,165,233,0.07) inset, 0 8px 40px rgba(0,0,0,0.4)"}}>
        <div style={{position:"absolute",top:-60,right:-60,width:160,height:160,borderRadius:"50%",background:"radial-gradient(circle,rgba(14,165,233,0.24),rgba(109,40,217,0.14) 45%,transparent 70%)"}}/>
        <div style={{display:"flex",alignItems:"baseline",gap:10}}>
          <span style={{fontFamily:DF,fontStyle:"italic",fontSize:46,fontWeight:600,animation:"scoreGlow 4s ease-in-out infinite"}}>{inn.runs}</span>
          <span style={{fontSize:22,color:"rgba(180,200,255,0.45)",fontWeight:600}}>/ {inn.wickets}</span>
          <span style={{marginLeft:"auto",fontFamily:NF,fontSize:15,color:"rgba(180,200,255,0.45)"}}>{ovLbl} ov</span>
        </div>
        <div style={{display:"flex",gap:18,marginTop:6,fontSize:12.5,color:"rgba(180,200,255,0.45)"}}>
          <span>CRR {crr}</span>{inn.target!=null&&<span>Target {inn.target}</span>}
        </div>
        {winBar&&<div style={{marginTop:14}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"rgba(180,200,255,0.45)",marginBottom:5}}>
            <span>Need {Math.max(0,winBar.rem)}{winBar.bleft!=null?` off ${winBar.bleft} balls`:""}</span>
            <span>{winBar.rrr!=null?`RRR ${winBar.rrr.toFixed(2)}`:""}</span>
          </div>
          <div style={{height:8,borderRadius:6,background:"rgba(255,255,255,0.06)",overflow:"hidden",display:"flex"}}>
            <div style={{width:`${winBar.prob}%`,background:"linear-gradient(to right,#0EA5E9,#6D28D9,#DC2626)",transition:"width 0.4s ease"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginTop:4,color:"rgba(180,200,255,0.45)"}}>
            <span style={{color:C.accentText}}>{bat.name} {winBar.prob.toFixed(0)}%</span>
            <span>{bowl.name} {(100-winBar.prob).toFixed(0)}%</span>
          </div>
          <div style={{fontSize:10,color:"rgba(180,200,255,0.45)",marginTop:4,opacity:.6}}>Estimated win probability.</div>
        </div>}
      </Card>
      <div>
        <div style={{fontSize:11.5,color:"rgba(180,200,255,0.45)",marginBottom:6}}>THIS OVER</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {inn.overBalls.length===0&&<span style={{color:"rgba(180,200,255,0.45)",fontSize:13}}>New over</span>}
          {inn.overBalls.map((b,i)=><BallDot key={i} ball={b}/>)}
        </div>
      </div>
      <div style={{display:"flex",gap:10}}>
        <Card style={{flex:1,padding:12}}>
          <div style={{fontSize:11,color:"rgba(14,165,233,0.5)",marginBottom:8,letterSpacing:1.2}}>BATTING</div>
          {strPl&&<PLine player={strPl} stats={strSt} active/>}
          {nsPl?<PLine player={nsPl} stats={nsSt}/>:<div style={{fontSize:12,color:"rgba(180,200,255,0.45)",marginTop:8}}>Batting alone</div>}
        </Card>
        <Card style={{flex:1,padding:12}}>
          <div style={{fontSize:11,color:"rgba(14,165,233,0.5)",marginBottom:8,letterSpacing:1.2}}>BOWLING</div>
          {bwlPl?<div style={{display:"flex",alignItems:"center",gap:8}}><Avatar player={bwlPl} size={28}/><div><div style={{fontSize:13.5,fontWeight:600}}>{bwlPl.name}</div><div style={{fontSize:11.5,color:"rgba(180,200,255,0.45)",fontFamily:NF}}>{oversStr(bwlSt.balls)}-{bwlSt.runs}-{bwlSt.wickets}</div></div></div>:<div style={{fontSize:12,color:"rgba(180,200,255,0.45)"}}>—</div>}
        </Card>
      </div>
      <div>
        <div style={{fontSize:11.5,color:"rgba(180,200,255,0.45)",marginBottom:6}}>RUNS</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:7}}>
          {[0,1,2,3,4,6].map(r=><button key={r} onClick={()=>onEvent({kind:"RUN",runs:r})} style={{padding:"16px 0",borderRadius:14,border:`1px solid ${r===6?"rgba(220,38,38,0.5)":r===4?"rgba(14,165,233,0.5)":"rgba(255,255,255,0.08)"}`,background:r===6?"rgba(220,38,38,0.14)":r===4?"rgba(14,165,233,0.14)":"rgba(255,255,255,0.05)",color:r===6?"#FCA5A5":r===4?"#7DD3FC":C.text,fontFamily:NF,fontSize:18,fontWeight:700,cursor:"pointer",boxShadow:r===6?"0 0 12px rgba(220,38,38,0.2) inset":r===4?"0 0 12px rgba(14,165,233,0.2) inset":"none",backdropFilter:"blur(8px)"}}>{r}</button>)}
        </div>
      </div>
      <div>
        <div style={{fontSize:11.5,color:"rgba(180,200,255,0.45)",marginBottom:6}}>EXTRAS</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:7}}>
          <button onClick={()=>onEvent({kind:"EXTRA",type:"WD",runs:0})} style={xStyle()}>WD</button>
          <button onClick={()=>onEvent({kind:"EXTRA",type:"NB",runs:0})} style={xStyle()}>NB</button>
          <button onClick={()=>setXPick(xPick==="LB"?null:"LB")} style={xStyle(xPick==="LB")}>LB</button>
          <button onClick={()=>setXPick(xPick==="BYE"?null:"BYE")} style={xStyle(xPick==="BYE")}>BYE</button>
        </div>
        {xPick&&<div style={{display:"flex",gap:6,marginTop:8}}>
          {[1,2,3,4].map(n=><button key={n} onClick={()=>{onEvent({kind:"EXTRA",type:xPick,runs:n});setXPick(null)}} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1px solid ${C.accent}`,background:C.accentSoft,color:C.accentText,fontFamily:NF,fontWeight:700,cursor:"pointer"}}>{n}</button>)}
        </div>}
      </div>
      <button onClick={()=>setModal({type:"wicket"})} style={{width:"100%",padding:"15px 0",borderRadius:14,border:"1px solid rgba(220,38,38,0.45)",background:"linear-gradient(135deg,rgba(220,38,38,0.18) 0%,rgba(153,27,27,0.08) 100%)",color:"#FCA5A5",fontWeight:700,fontSize:15,letterSpacing:1,cursor:"pointer",boxShadow:"0 0 24px rgba(220,38,38,0.15) inset, 0 4px 20px rgba(220,38,38,0.12)"}}>WICKET</button>
      <button onClick={()=>setConfExit("declare")} style={{background:"none",border:"none",color:"rgba(180,200,255,0.45)",fontSize:12.5,textAlign:"center",padding:"4px 0",cursor:"pointer"}}>End this innings now</button>
    </div>
    {confExit&&<Modal title={confExit==="declare"?"End innings now?":"Leave match?"} onClose={()=>setConfExit(false)}>
      <div style={{color:"rgba(180,200,255,0.45)",fontSize:14,marginBottom:16}}>{confExit==="declare"?"This closes the current innings immediately.":"Unsaved scoring progress will be lost."}</div>
      <div style={{display:"flex",gap:10}}>
        <Btn variant="ghost" onClick={()=>setConfExit(false)} style={{flex:1}}>Cancel</Btn>
        <Btn variant="danger" style={{flex:1}} onClick={()=>{confExit==="declare"?onDeclare():onExit();setConfExit(false)}}>{confExit==="declare"?"End innings":"Leave"}</Btn>
      </div>
    </Modal>}
    {modal?.type==="wicket"&&<WicketModal inn={inn} strPl={strPl} nsPl={nsPl} onClose={()=>setModal(null)} onConfirm={p=>{onEvent({kind:"WICKET",...p});setModal(null)}}/>}
    {modal?.type==="batter"&&<PickModal title={inn.striker==null&&inn.nonStriker==null?"Select opening batter":"Select next batter"} players={eligible(inn,bat.players)} onPick={onBatter}/>}
    {modal?.type==="bowler"&&<PickModal title="Who's bowling this over?" players={bowl.players} onPick={onBowler} prevId={inn.bowler}/>}
  </div>
}

function PLine({player,stats,active}){
  if(!player)return null;
  return<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
    <Avatar player={player} size={28}/>
    <div style={{flex:1,fontSize:13.5,fontWeight:active?700:500,color:active?C.text:C.textMuted}}>{player.name}{active&&<span style={{color:C.accent}}> ●</span>}</div>
    <div style={{fontFamily:NF,fontSize:13,color:"rgba(180,200,255,0.45)"}}>{stats?`${stats.runs} (${stats.balls})`:"0 (0)"}</div>
  </div>
}

function WicketModal({inn,strPl,nsPl,onClose,onConfirm}){
  const [runs,setRuns]=useState(0);
  const [slot,setSlot]=useState("striker");
  const [how,setHow]=useState("Bowled");
  const [caughtBy,setCaughtBy]=useState("bowler");

/* ── PNG EXPORT ── */
async function exportSummaryPNG(match,mom){
  const W=800,H=mom?660:520,P=40;
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const g=c.getContext("2d");
  const grad=g.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,"#050508");grad.addColorStop(1,"#0a0a18");
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  const glo=g.createRadialGradient(W/2,H,0,W/2,H,W*0.7);
  glo.addColorStop(0,"rgba(14,165,233,0.18)");glo.addColorStop(1,"rgba(14,165,233,0)");
  g.fillStyle=glo;g.fillRect(0,0,W,H);
  function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.arcTo(x+w,y,x+w,y+r,r);g.lineTo(x+w,y+h-r);g.arcTo(x+w,y+h,x+w-r,y+h,r);g.lineTo(x+r,y+h);g.arcTo(x,y+h,x,y+h-r,r);g.lineTo(x,y+r);g.arcTo(x,y,x+r,y,r);g.closePath()}
  g.fillStyle="rgba(255,255,255,0.05)";rr(P,P,W-P*2,80,16);g.fill();
  g.strokeStyle="rgba(14,165,233,0.3)";g.lineWidth=1;rr(P,P,W-P*2,80,16);g.stroke();
  g.font="bold 13px sans-serif";g.fillStyle="rgba(14,165,233,0.6)";g.textAlign="center";
  g.fillText("CRICKET SCORER",W/2,P+22);
  g.font="bold 28px Georgia";g.fillStyle="#EEF2FF";
  g.fillText(match.result?.text||"",W/2,P+58);
  let y=P+100;
  match.innings.forEach(inn=>{
    const tm=teamById(match.cfg,inn.batId);
    g.fillStyle="rgba(255,255,255,0.04)";rr(P,y,W-P*2,70,12);g.fill();
    g.strokeStyle="rgba(255,255,255,0.07)";rr(P,y,W-P*2,70,12);g.stroke();
    g.font="bold 15px sans-serif";g.fillStyle="#EEF2FF";g.textAlign="left";
    g.fillText(tm.name+" — Innings "+inn.num,P+18,y+26);
    g.font="bold 22px monospace";g.fillStyle="#7DD3FC";g.textAlign="right";
    g.fillText(inn.runs+"/"+inn.wickets,W-P-18,y+26);
    g.font="12px sans-serif";g.fillStyle="rgba(180,200,255,0.5)";g.textAlign="left";
    g.fillText(oversStr(inn.balls)+" overs",P+18,y+50);
    y+=82;
  });
  if(mom){y+=8;
    g.fillStyle="rgba(245,158,11,0.1)";rr(P,y,W-P*2,100,12);g.fill();
    g.strokeStyle="rgba(245,158,11,0.35)";rr(P,y,W-P*2,100,12);g.stroke();
    g.font="bold 11px sans-serif";g.fillStyle="rgba(245,158,11,0.7)";g.textAlign="left";
    g.fillText("MAN OF THE MATCH",P+18,y+24);
    g.font="bold 22px Georgia";g.fillStyle="#FDE68A";g.fillText(mom.player.name,P+18,y+52);
    g.font="12px sans-serif";g.fillStyle="rgba(245,158,11,0.6)";g.fillText(mom.teamName,P+18,y+72);
    g.fillStyle="rgba(220,220,255,0.7)";g.fillText(mom.reason,P+18,y+90);
  }
  g.font="11px sans-serif";g.fillStyle="rgba(255,255,255,0.2)";g.textAlign="center";
  g.fillText("Cricket Scorer",W/2,H-16);
  c.toBlob(async blob=>{
    try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:"cricket-summary.png",data:blob});return}}catch(e){}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cricket-summary.png";a.click();
  },"image/png");
}

/* ── MAN OF THE MATCH ── */
function calcMOM(match){
  const ps={};// playerId -> {name,teamId,bat:{runs,balls,pressureMul},bowl:{balls,runs,wickets}}
  const winTeamId=match.result?.text?.includes("won")?
    (match.innings[match.innings.length-1].runs>=(match.innings[match.innings.length-1].target||Infinity)?
      match.innings[match.innings.length-1].batId:match.innings[match.innings.length-1].bowlId)
    :null;

  for(const inn of match.innings){
    const batTeam=teamById(match.cfg,inn.batId);
    const bowlTeam=teamById(match.cfg,inn.bowlId);
    // batting
    for(const [pid,st] of Object.entries(inn.batsmen)){
      if(!ps[pid]){const pl=batTeam.players.find(p=>p.id===pid);ps[pid]={name:pl?.name||pid,teamId:inn.batId,bat:{runs:0,balls:0,pressureMul:1},bowl:{balls:0,runs:0,wickets:0}}}
      const orderIdx=inn.battingOrderUsed?.indexOf(pid)??-1;
      // wickets in hand when this batter arrived
      const wih=orderIdx<=1?inn.totalBatters-1:inn.totalBatters-1-(orderIdx-1);
      // pressure multiplier: 1-2 wickets in hand + batting team won = massive bonus
      let pm=1;
      if(wih<=1&&inn.batId===winTeamId)pm=3.5;
      else if(wih<=2&&inn.batId===winTeamId)pm=2.5;
      else if(wih<=3&&inn.batId===winTeamId)pm=1.6;
      else if(wih<=2)pm=1.3;
      ps[pid].bat.runs+=st.runs;ps[pid].bat.balls+=st.balls;
      ps[pid].bat.pressureMul=Math.max(ps[pid].bat.pressureMul,pm);
      ps[pid].teamId=inn.batId;
    }
    // bowling
    for(const [pid,st] of Object.entries(inn.bowlers)){
      if(!ps[pid]){const pl=bowlTeam.players.find(p=>p.id===pid);ps[pid]={name:pl?.name||pid,teamId:inn.bowlId,bat:{runs:0,balls:0,pressureMul:1},bowl:{balls:0,runs:0,wickets:0}}}
      ps[pid].bowl.balls+=st.balls;ps[pid].bowl.runs+=st.runs;ps[pid].bowl.wickets+=st.wickets;
    }
  }

  let bestId=null,bestScore=-1,bestReason="";
  for(const [pid,p] of Object.entries(ps)){
    // Batting score: runs × (1 + SR/100) × pressure
    const sr=p.bat.balls>0?(p.bat.runs/p.bat.balls)*100:0;
    const batScore=p.bat.runs*(1+sr/100)*p.bat.pressureMul;
    // Bowling score: economy-weighted wickets + runs saved
    let bowlScore=0;
    if(p.bowl.balls>=6){
      const overs=p.bowl.balls/6;
      const econ=p.bowl.runs/overs;
      // Economy factor: <4 = excellent, 4-6 = good, 6-9 = average, 9-12 = poor, >12 = bad
      const ef=econ<4?2.8:econ<6?2.0:econ<9?1.3:econ<12?0.9:0.5;
      const runsaved=Math.max(0,(overs*8)-p.bowl.runs);// vs par economy of 8
      bowlScore=(p.bowl.wickets*20+runsaved*1.5)*ef;
    }
    const total=batScore+bowlScore;
    if(total>bestScore){
      bestScore=total;bestId=pid;
      // Build reason string
      const overs=p.bowl.balls>=6?oversStr(p.bowl.balls):null;
      const econ=p.bowl.balls>=6?(p.bowl.runs/(p.bowl.balls/6)).toFixed(1):null;
      const pressStr=p.bat.pressureMul>=3?"under extreme pressure, match-winning innings":p.bat.pressureMul>=2?"under pressure":"";
      if(batScore>=bowlScore){
        bestReason=`${p.bat.runs} runs (${p.bat.balls} balls, SR ${sr.toFixed(0)})${pressStr?" — "+pressStr:""}`;
      } else {
        bestReason=`${p.bowl.wickets}/${p.bowl.runs} in ${overs} overs · Econ ${econ}`;
      }
    }
  }
  if(!bestId)return null;
  const p=ps[bestId];
  for(const team of [match.cfg.teamA,match.cfg.teamB]){
    const player=team.players.find(pl=>pl.id===bestId);
    if(player)return{player,teamName:team.name,reason:bestReason,score:bestScore};
  }
  return null;
}

          <button onClick={copyCode} style={{background:"rgba(14,165,233,0.12)",border:"1px solid rgba(14,165,233,0.3)",borderRadius:8,padding:"5px 12px",color:C.accentText,cursor:"pointer",fontSize:12}}>{copyLabel}</button>
        </div>
        <div style={{fontSize:12.5,color:"rgba(180,200,255,0.45)",marginBottom:14}}>Share this 6-character code with friends. Anyone who joins can see and edit your teams, matches, and points table.</div>
        <Btn variant="danger" onClick={onLeave} full>Leave network</Btn>
      </Card>}
      {!currentNet&&<>
        <div style={{display:"flex",background:"rgba(255,255,255,0.04)",borderRadius:12,padding:4,gap:2}}><TB v="join" lbl="Join a network"/><TB v="create" lbl="Create one"/></div>
        {tab==="join"&&<Card>
          <div style={{fontSize:11,color:"rgba(14,165,233,0.5)",letterSpacing:1.2,marginBottom:8}}>NETWORK CODE</div>
          <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="ABC123" maxLength={8}
            style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(14,165,233,0.3)",borderRadius:12,padding:"12px 14px",color:C.text,fontSize:20,fontFamily:NF,letterSpacing:4,textAlign:"center",marginBottom:12}}/>
          {err&&<div style={{color:"#FCA5A5",fontSize:12.5,marginBottom:10}}>{err}</div>}
          <Btn variant="accent" disabled={code.trim().length<4||loading} onClick={handleJoin} full>{loading?"Joining…":"Join network"}</Btn>
        </Card>}
        {tab==="create"&&<Card>
          <div style={{fontSize:11,color:"rgba(14,165,233,0.5)",letterSpacing:1.2,marginBottom:8}}>NETWORK NAME</div>
          <input value={netName} onChange={e=>setNetName(e.target.value)} placeholder="e.g. Sunday Legends"
            style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(14,165,233,0.3)",borderRadius:12,padding:"12px 14px",color:C.text,fontSize:15,marginBottom:12}}/>
          {err&&<div style={{color:"#FCA5A5",fontSize:12.5,marginBottom:10}}>{err}</div>}
          <Btn variant="accent" disabled={!netName.trim()||loading} onClick={handleCreate} full>{loading?"Creating…":"Create network"}</Btn>
        </Card>}
      </>}
      <Card>
        <div style={{fontSize:11,color:"rgba(14,165,233,0.5)",letterSpacing:1.2,marginBottom:8}}>WHAT A NETWORK GIVES YOU</div>
        {["Teams synced across all phones","Last 20 matches visible to everyone","Same points table for the whole group","Anyone can make changes — no admin needed"].map((t,i)=>
          <div key={i} style={{display:"flex",gap:8,marginBottom:6,fontSize:13,color:"rgba(180,200,255,0.6)"}}><span style={{color:C.accentText}}>✓</span>{t}</div>)}
      </Card>
    </div>
  </div>
}

function HistoryScreen({matches,onBack}){
  return<div style={{paddingBottom:110}}>
    <Hdr title="Match History" onBack={onBack}/>
    <div style={{padding:"0 18px",display:"flex",flexDirection:"column",gap:10}}>
      {matches.length===0&&<div style={{color:"rgba(180,200,255,0.45)",fontSize:14,padding:"24px 4px"}}>No past matches yet.</div>}
      {[...matches].reverse().slice(0,20).map((m,i)=><Card key={i}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
          <span style={{fontWeight:700,fontSize:14}}>{m.cfg?.teamA?.name} vs {m.cfg?.teamB?.name}</span>
          <span style={{fontFamily:NF,fontSize:12,color:"rgba(180,200,255,0.4)"}}>{m.cfg?.formatLabel||""}</span>
        </div>
        <div style={{fontSize:13,color:C.accentText,marginBottom:m.mom?4:0}}>{m.result?.text}</div>
        {m.mom&&<div style={{fontSize:12,color:"rgba(245,158,11,0.7)"}}>🏆 {m.mom.player?.name} — {m.mom.reason}</div>}
        {m.playedAt&&<div style={{fontSize:11,color:"rgba(180,200,255,0.3)",marginTop:4}}>{new Date(m.playedAt).toLocaleDateString()}</div>}
      </Card>)}
    </div>
  </div>
}

/* ── ROOT APP ── */
function App(){
  const [screen,setScreen]=useState("loading");
  const [navOpen,setNavOpen]=useState(false);
  const [teams,setTeams]=useState([]);
  const [ptTable,setPtTable]=useState([]);
  const [editTeam,setEditTeam]=useState(null);
  const [match,setMatch]=useState(null);
  const [hist,setHist]=useState([]);
  const [modal,setModal]=useState(null);
  const [recorded,setRecorded]=useState(false);
  const [userName,setUserName]=useState("");
  const [userId,setUserId]=useState(null);
  const [network,setNetwork]=useState(null);
  const [dbRef,setDbRef]=useState(null);
  const [pastMatches,setPastMatches]=useState([]);
  const [tieMatch,setTieMatch]=useState(null);

  useEffect(()=>{
    try{const t=localStorage.getItem("cricket-teams");if(t)setTeams(JSON.parse(t))}catch(e){}
    try{const p=localStorage.getItem("cricket-points");if(p)setPtTable(JSON.parse(p))}catch(e){}
    try{const pm=localStorage.getItem("cricket-past");if(pm)setPastMatches(JSON.parse(pm))}catch(e){}
    const sn=localStorage.getItem("cricket-username")||"";
    if(sn){setUserName(sn);setScreen("home")}else{setScreen("login")}
    (async()=>{
      try{
        const db=await claude.use("db");const user=await claude.use("user");
        if(db&&user){setDbRef(db);const uid=await user.id();setUserId(uid);
          try{const prof=await db.collection("data/users/"+uid).doc("prof").get();
            if(prof?.netCode){const ni=await db.doc("net_"+prof.netCode+"/info").get();
              if(ni){setNetwork({code:prof.netCode,name:ni.name||"Network"});subNet(db,prof.netCode);}}}catch(e){}
        }
      }catch(e){}
    })();
  },[]);

  function subNet(db,code){
    db.doc("net_"+code+"/data").onSnapshot(snap=>{
      if(!snap)return;
      if(snap.teams)setTeams(snap.teams);
      if(snap.points)setPtTable(snap.points);
      if(snap.matches)setPastMatches(snap.matches);
    });
  }
  async function handleLogin(name){
    setUserName(name);localStorage.setItem("cricket-username",name);setScreen("home");
    if(userId&&dbRef)try{await dbRef.collection("data/users/"+userId).doc("prof").update({name})}catch(e){}
  }
  async function saveTeams(next){setTeams(next);localStorage.setItem("cricket-teams",JSON.stringify(next));
    if(dbRef&&network)try{await dbRef.doc("net_"+network.code+"/data").update({teams:next})}catch(e){}}
  async function savePts(next){setPtTable(next);localStorage.setItem("cricket-points",JSON.stringify(next));
    if(dbRef&&network)try{await dbRef.doc("net_"+network.code+"/data").update({points:next})}catch(e){}}
  async function savePast(next){const tr=next.slice(-20);setPastMatches(tr);localStorage.setItem("cricket-past",JSON.stringify(tr));
    if(dbRef&&network)try{await dbRef.doc("net_"+network.code+"/data").update({matches:tr})}catch(e){}}
  async function handleCreateNet(code,name){if(!dbRef)return;
    await dbRef.doc("net_"+code+"/info").set({name,createdAt:Date.now()});
    await dbRef.doc("net_"+code+"/data").set({teams,points:ptTable,matches:pastMatches});
    if(userId)await dbRef.collection("data/users/"+userId).doc("prof").set({name:userName,netCode:code});
    setNetwork({code,name});subNet(dbRef,code);}
  async function handleJoinNet(code){if(!dbRef)return false;
    try{const info=await dbRef.doc("net_"+code+"/info").get();if(!info)return false;
      setNetwork({code,name:info.name||"Network"});
      if(userId)await dbRef.collection("data/users/"+userId).doc("prof").set({name:userName,netCode:code});
      subNet(dbRef,code);return true;}catch(e){return false;}}
  async function handleLeaveNet(){
    if(userId&&dbRef)try{await dbRef.collection("data/users/"+userId).doc("prof").update({netCode:null})}catch(e){}
    setNetwork(null);}

  function saveTeam(team){
    const next=teams.some(t=>t.id===team.id)?teams.map(t=>t.id===team.id?team:t):[...teams,team];
    saveTeams(next);setEditTeam(null);setScreen("teams");
  }

  function go(s){setScreen(s);setNavOpen(false)}

  function startNew(cfg){
    const m=startMatch(cfg);setMatch(m);setHist([]);setRecorded(false);setTieMatch(null);
    setModal(getPending(m));setScreen("match");
  }

  function doEvent(ev){
    const m2=clone(match);
    setHist(h=>[...h,match].slice(-30));
    const inn=curInn(m2);const{bat}=teamsFor(m2,inn);
    bowl(inn,{...ev,teamPlayers:bat.players},inn.bowler);
    autoFill(m2);checkEnd(m2);
    setMatch(m2);
    if(m2.status==="done"){setModal(null);const mm=calcMOM(m2);savePast([...pastMatches,{...m2,mom:mm?{player:mm.player,teamName:mm.teamName,reason:mm.reason}:null,playedAt:Date.now()}]);setScreen("summary")}
    else if(m2.status==="tied"){setModal(null);setTieMatch(m2);setScreen("tie")}
    else setModal(getPending(m2));
  }

  function doBatter(id){
    const m2=clone(match);setHist(h=>[...h,match].slice(-30));
    setBatter(curInn(m2),id);autoFill(m2);setMatch(m2);setModal(getPending(m2));
  }

  function doBowler(id){
    const m2=clone(match);setHist(h=>[...h,match].slice(-30));
    setBowler(curInn(m2),id);setMatch(m2);setModal(getPending(m2));
  }

  function doDeclare(){
    const m2=clone(match);setHist(h=>[...h,match].slice(-30));
    curInn(m2).completed=true;checkEnd(m2);setMatch(m2);
    if(m2.status==="done"){setModal(null);const mm=calcMOM(m2);savePast([...pastMatches,{...m2,mom:mm?{player:mm.player,teamName:mm.teamName,reason:mm.reason}:null,playedAt:Date.now()}]);setScreen("summary")}
    else if(m2.status==="tied"){setModal(null);setTieMatch(m2);setScreen("tie")}
    else setModal(getPending(m2));
  }

  function doUndo(){
    if(!hist.length)return;
    const prev=hist[hist.length-1];setHist(h=>h.slice(0,-1));
    setMatch(prev);setModal(getPending(prev));
  }

  function recordResult(){
    if(!match||recorded)return;
    const{aT,bT}=match.result||{aT:0,bT:0};const aWon=aT>bT,tie=aT===bT;
    let next=[...ptTable];
    [match.cfg.teamA,match.cfg.teamB].forEach((tm,i)=>{
      const won=tie?false:i===0?aWon:!aWon;
      let row=next.find(r=>r.teamName===tm.name);
      if(!row){row={id:uid("r"),teamName:tm.name,played:0,won:0,lost:0,points:0};next.push(row)}
      row.played++;if(won){row.won++;row.points+=2}else if(tie){row.points+=1}else row.lost++;
    });
    savePts(next);setRecorded(true);
  }

  const GlobeIcon=({size=24})=><Ico size={size}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></Ico>;
  const ClockIcon=({size=24})=><Ico size={size}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Ico>;
  const navItems=[["home","Home",HomeIcon],["newMatch","New match",Swords],["teams","Teams",Users],["points","Points",Trophy],["history","History",ClockIcon],["network",network?"Net ✓":"Network",GlobeIcon]];
  return<div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",maxWidth:480,margin:"0 auto",position:"relative"}}>
    {screen==="loading"&&<div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{color:"rgba(14,165,233,0.5)",fontSize:14}}>Loading…</div></div>}
    {screen==="login"&&<LoginScreen onLogin={handleLogin}/>}
    {screen==="home"&&<HomeScreen onNew={()=>go("newMatch")} onTeams={()=>go("teams")} onPoints={()=>go("points")} hasLive={!!match&&match.status==="playing"} onResume={()=>setScreen("match")} hasHistory={pastMatches.length>0} onHistory={()=>go("history")}/>}
    {screen==="teams"&&!editTeam&&<TeamsScreen teams={teams} onNew={()=>setEditTeam({id:uid("team"),name:"",players:[{id:uid("p"),name:"",photo:null}]})} onEdit={t=>setEditTeam(t)} onDel={id=>saveTeams(teams.filter(t=>t.id!==id))}/>}
    {screen==="teams"&&editTeam&&<TeamEditor initial={editTeam.name!==""||editTeam.players?.length>0?editTeam:null} onSave={saveTeam} onCancel={()=>setEditTeam(null)}/>}
    {screen==="newMatch"&&<NewMatchScreen teams={teams} onStart={startNew} onGoTeams={()=>go("teams")}/>}
    {screen==="match"&&match&&<MatchScreen match={match} onEvent={doEvent} onBatter={doBatter} onBowler={doBowler} onUndo={doUndo} canUndo={hist.length>0} onDeclare={doDeclare} onExit={()=>{setScreen("home")}} modal={modal} setModal={setModal}/>}
    {screen==="tie"&&tieMatch&&<div style={{paddingBottom:110}}>
      <Hdr title="Match Tied" onBack={()=>{setMatch({...tieMatch,status:"done"});setScreen("summary")}}/>
      <div style={{padding:"0 18px",display:"flex",flexDirection:"column",gap:12}}>
        <Card style={{textAlign:"center",padding:24,background:"linear-gradient(135deg,rgba(14,165,233,0.08),rgba(109,40,217,0.06))",border:"1px solid rgba(14,165,233,0.2)"}}>
          <div style={{fontFamily:DF,fontSize:26,fontWeight:600,marginBottom:6}}>Match Tied 🤝</div>
          <div style={{fontSize:14,color:"rgba(180,200,255,0.5)"}}>{tieMatch.cfg?.teamA?.name} and {tieMatch.cfg?.teamB?.name} are level</div>
        </Card>
        <button onClick={()=>{setMatch({...tieMatch,status:"done"});const mm=calcMOM(tieMatch);savePast([...pastMatches,{...tieMatch,status:"done",mom:mm?{player:mm.player,teamName:mm.teamName,reason:mm.reason}:null,playedAt:Date.now()}]);setScreen("summary")}} style={{padding:"18px",borderRadius:14,border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.04)",color:C.text,fontSize:14,fontWeight:600,cursor:"pointer",textAlign:"left"}}>
          <div style={{fontWeight:700,marginBottom:4}}>🤝 Accept the Tie</div>
          <div style={{fontSize:12,color:"rgba(180,200,255,0.45)"}}>Record as tied and view the summary</div>
        </button>
        <button onClick={()=>{const so=startSuperOver(tieMatch,6);setMatch(so);setHist([]);setTieMatch(null);setModal(getPending(so));setScreen("match")}} style={{padding:"18px",borderRadius:14,border:"1px solid rgba(14,165,233,0.4)",background:"rgba(14,165,233,0.08)",color:C.accentText,fontSize:14,fontWeight:600,cursor:"pointer",textAlign:"left"}}>
          <div style={{fontWeight:700,marginBottom:4}}>⚡ Super Over — 6 balls each</div>
          <div style={{fontSize:12,color:"rgba(14,165,233,0.5)"}}>One over per team. Highest score wins</div>
        </button>
        <button onClick={()=>{const so=startSuperOver(tieMatch,3);setMatch(so);setHist([]);setTieMatch(null);setModal(getPending(so));setScreen("match")}} style={{padding:"18px",borderRadius:14,border:"1px solid rgba(245,158,11,0.4)",background:"rgba(245,158,11,0.07)",color:"#FDE68A",fontSize:14,fontWeight:600,cursor:"pointer",textAlign:"left"}}>
          <div style={{fontWeight:700,marginBottom:4}}>🎯 Mini Super Over — 3 balls each</div>
          <div style={{fontSize:12,color:"rgba(245,158,11,0.5)"}}>Three balls. Win from the edge</div>
        </button>
      </div>
    </div>}
    {screen==="summary"&&match&&<SummaryScreen match={match} onHome={()=>setScreen("home")} onRecord={recordResult} recorded={recorded}/>}
    {screen==="points"&&<PointsScreen table={ptTable} setTable={savePts}/>}
    {screen==="history"&&<HistoryScreen matches={pastMatches} onBack={()=>go("home")}/>}
    {screen==="network"&&<NetworkScreen userId={userId} userName={userName} currentNet={network} onJoin={handleJoinNet} onCreate={handleCreateNet} onLeave={handleLeaveNet} onBack={()=>go("home")}/>}
    {screen!=="login"&&screen!=="loading"&&<BottomNav screen={screen} navItems={navItems} open={navOpen} setOpen={setNavOpen} setScreen={go}/>}
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
