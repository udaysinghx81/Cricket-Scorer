/* ── HELPERS ── */
function uid(p="id"){return p+"_"+Math.random().toString(36).slice(2,9)}
function oversStr(b){return`${Math.floor(b/6)}.${b%6}`}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}

/* ── SCORING ENGINE ── */
function newInn(batTeam,bowlTeam,num){
  return{num,batId:batTeam.id,bowlId:bowlTeam.id,totalBatters:batTeam.players.length,
    runs:0,wickets:0,balls:0,target:null,overBalls:[],outIds:[],battingOrderUsed:[],
    batsmen:{},bowlers:{},striker:null,nonStriker:null,bowler:null,
    needBowler:true,completed:false};
}
function eb(inn,id){if(!inn.batsmen[id])inn.batsmen[id]={runs:0,balls:0,fours:0,sixes:0,out:false,howOut:null}}
function ebw(inn,id){if(!inn.bowlers[id])inn.bowlers[id]={balls:0,runs:0,wickets:0}}
function swap(inn){if(inn.nonStriker!=null){const t=inn.striker;inn.striker=inn.nonStriker;inn.nonStriker=t}}
function eligible(inn,players){return players.filter(p=>!inn.outIds.includes(p.id)&&p.id!==inn.striker&&p.id!==inn.nonStriker)}
function setBatter(inn,id){eb(inn,id);inn.battingOrderUsed.push(id);if(inn.striker==null)inn.striker=id;else inn.nonStriker=id}
function setBowler(inn,id){ebw(inn,id);inn.bowler=id;inn.needBowler=false}

function bowl(inn,ev,bwlId){
  ebw(inn,bwlId);inn.bowler=bwlId;
  let legal=true,label="";
  if(ev.kind==="RUN"){
    inn.runs+=ev.runs;const b=inn.batsmen[inn.striker];b.runs+=ev.runs;b.balls++;
    if(ev.runs===4)b.fours++;if(ev.runs===6)b.sixes++;
    inn.bowlers[bwlId].runs+=ev.runs;label=""+ev.runs;
    if(ev.runs%2===1)swap(inn);
  } else if(ev.kind==="EXTRA"){
    if(ev.type==="WD"){legal=false;const tot=1+(ev.runs||0);inn.runs+=tot;inn.bowlers[bwlId].runs+=tot;label="WD"}
    else if(ev.type==="NB"){legal=false;const tot=1+(ev.runs||0);inn.runs+=tot;inn.bowlers[bwlId].runs+=tot;if(ev.runs){const b=inn.batsmen[inn.striker];b.runs+=ev.runs;if(ev.runs===4)b.fours++;if(ev.runs===6)b.sixes++}label="NB"}
    else{inn.runs+=ev.runs;inn.bowlers[bwlId].runs+=ev.runs;inn.batsmen[inn.striker].balls++;label=ev.type;if(ev.runs%2===1)swap(inn)}
  } else if(ev.kind==="WICKET"){
    const dId=ev.dismissedId||inn.striker;
    if(ev.runsCompleted){inn.runs+=ev.runsCompleted;inn.batsmen[inn.striker].runs+=ev.runsCompleted;inn.bowlers[bwlId].runs+=ev.runsCompleted}
    inn.batsmen[inn.striker].balls++;inn.batsmen[dId].out=true;inn.batsmen[dId].howOut=ev.howOut||"out";
    if(!ev.noBallCredit)inn.bowlers[bwlId].wickets++;
    inn.wickets++;inn.outIds.push(dId);label="W";
    if(dId===inn.striker)inn.striker=null;else if(dId===inn.nonStriker)inn.nonStriker=null;
  }
  if(legal){inn.balls++;inn.bowlers[bwlId].balls++}
  inn.overBalls.push({label,legal});
  if(legal&&inn.balls%6===0&&!inn.completed){inn.overBalls=[];swap(inn);inn.needBowler=true}
  return inn;
}

/* ── UI COMPONENTS ── */
function Avatar({player,size=36}){
  const init=(player?.name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()).join("");
  return <div style={{width:size,height:size,borderRadius:"50%",overflow:"hidden",flexShrink:0,background:"rgba(255,255,255,0.06)",border:`1px solid ${C.line}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.36,fontWeight:700,color:C.accentText}}>
    {player?.photo?<img src={player.photo} alt={player.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:init||"?"}
  </div>
}

function Btn({children,onClick,variant="default",style,disabled,full}){
  const base={border:"none",cursor:disabled?"not-allowed":"pointer",fontWeight:600,fontSize:14,borderRadius:14,padding:"12px 16px",transition:"opacity 0.15s",opacity:disabled?.35:1,width:full?"100%":undefined,display:"flex",alignItems:"center",justifyContent:"center",gap:6};
  const vs={default:{background:"rgba(255,255,255,0.06)",color:C.text,border:"1px solid rgba(255,255,255,0.1)"},accent:{background:"linear-gradient(135deg,#0EA5E9 0%,#0369A1 100%)",color:"#03070A"},ghost:{background:"transparent",color:C.textMuted,border:"1px solid rgba(255,255,255,0.08)"}};
  return<button disabled={disabled} onClick={onClick} style={{...base,...vs[variant],...style}}>{children}</button>
}

function Card({children,style,onClick}){

}

function Hdr({title,onBack,right}){
  return<div style={{display:"flex",alignItems:"center",gap:10,padding:"18px 18px 10px"}}>
    {onBack&&<button onClick={onBack} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",color:"#EEF2FF",cursor:"pointer"}}><ArrowLeft size={18}/></button>}
    <div style={{fontFamily:DF,fontSize:22,fontWeight:600,flex:1}}>{title}</div>
    {right}
  </div>
}
